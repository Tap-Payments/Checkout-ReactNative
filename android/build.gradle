buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['CheckoutReactNative_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    // The consuming app's root project supplies AGP; this only matters when the
    // library is evaluated on its own.
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"

// AGP 9+ ships a built-in Kotlin plugin; only apply the standalone one when it isn't present.
if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["CheckoutReactNative_" + name]).toInteger()
}

android {
  namespace "com.checkoutreactnative"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  mavenCentral()
  google()
  maven { url 'https://jitpack.io' }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation 'com.github.Tap-Payments:Checkout-Android:1.0.6'
}

react {
  jsRootDir = file("../src/")
  libraryName = "CheckoutReactNative"
  codegenJavaPackageName = "com.checkoutreactnative"
}
